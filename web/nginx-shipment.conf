# Zava Logistics — nginx front end for the Ubuntu web tier.
#
# Two server names, one upstream:
#   dash.99b.org   the operations board, shown on the stage screen
#   track.99b.org  the audience-facing page reached from a QR code
#
# TLS is added by certbot (see docs/architecture.md); this file is the plain
# HTTP baseline so the estate works on the isolated lab subnet too.

# Rate limit the write path only. Reads are cheap and the whole room will be
# polling the dashboard, so throttling GETs would break the demo, not protect it.
limit_req_zone $binary_remote_addr zone=shipment_create:10m rate=12r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=shipment_conn:10m;

upstream shipment_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dash.99b.org track.99b.org _;

    client_max_body_size 16k;
    limit_conn shipment_conn 24;

    # Conference wifi is hostile enough without also leaking the version banner.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/shipment.access.log;
    error_log  /var/log/nginx/shipment.error.log warn;

    # track.99b.org lands directly on the audience page; dash.99b.org lands on
    # the board. Same application, different front door.
    location = / {
        if ($host = track.99b.org) {
            return 302 /track;
        }
        proxy_pass http://shipment_web;
        include /etc/nginx/proxy_params;
        # The dashboard prints the tracking address for the audience. Pass the
        # host the browser actually used so that address is reachable -- an IP
        # on Hyper-V, a real name once DNS exists in Azure.
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /static/ {
        proxy_pass http://shipment_web;
        include /etc/nginx/proxy_params;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Shipment creation: the one endpoint a room full of people can abuse.
    location = /api/shipments {
        limit_req zone=shipment_create burst=4 nodelay;
        proxy_pass http://shipment_web;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/shipments/[^/]+/advance$ {
        limit_req zone=shipment_create burst=8 nodelay;
        proxy_pass http://shipment_web;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://shipment_web;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }
}
